<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Pengajuan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-6 rounded-2xl shadow w-full max-w-md">
  <h2 class="text-xl font-bold mb-4">Form Pengajuan</h2>
  <form id="form">
    <input class="w-full mb-3 p-2 border rounded" placeholder="Nama" id="nama" required />
    <input class="w-full mb-3 p-2 border rounded" placeholder="Email" id="email" required />
    <input class="w-full mb-3 p-2 border rounded" placeholder="NIK KTP" id="nik" required />
    <input class="w-full mb-3 p-2 border rounded" placeholder="OTP" id="otp" required />
    <button class="w-full bg-orange-400 text-white py-2 rounded">Kirim</button>
  </form>
</div>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = {
    nama: document.getElementById("nama").value,
    email: document.getElementById("email").value,
    nik: document.getElementById("nik").value,
    otp: document.getElementById("otp").value
  };
  const res = await fetch("/api/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });
  const result = await res.json();
  alert(result.message);
});
</script>
</body>
</html>
